<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CheetCode Bridge Preflight</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <strong><span aria-hidden="true">🔥</span> CheetCode v3</strong>
      <span class="handle">@preflight</span>
      <span class="level">LEVEL 1</span>
      <span id="final-status" role="status"></span>
      <time>01:00</time>
      <button id="finish" type="button">Finish &amp; Submit</button>
    </header>
    <main id="challenge" aria-label="Level 1 challenge">
      <section id="pre-start" aria-label="Level instructions">
        <p>Choose any setup answers, then start when ready.</p>
        <button id="start-level" type="button">Skip and Start</button>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
